[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-dropbox-migrator"
version = "0.1.0"
description = "Resumable one-file-at-a-time iCloud to Dropbox migrator for macOS."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jas Richa" }]
dependencies = []

[project.scripts]
icloud-dropbox-migrator = "icloud_dropbox_migrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
icloud_dropbox_migrator = ["native_icloud.jxa"]

[tool.setuptools.packages.find]
where = ["src"]
